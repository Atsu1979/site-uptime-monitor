name: uptime

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（GitHub が混んでいると遅れることがある）
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Telegram にテストを1通送るだけ（鍵の登録を確かめる）"
        type: boolean
        default: false

permissions:
  contents: write   # status/ と STATUS.md を書き戻す
  issues: write     # 障害ごとに Issue を開け閉めする

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test notification
        if: ${{ inputs.test_notify }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m monitor.main --test-notify
      - name: Check sites
        if: ${{ !inputs.test_notify }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m monitor.main
      - name: Save status when it changed
        if: ${{ !inputs.test_notify }}
        run: |
          if [ -n "$(git status --porcelain -- status STATUS.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status STATUS.md
            git commit -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash
            git push
          fi
